[project]
name = "agentforge"
version = "0.1.0"
description = "Plataforma para criar e executar agentes de IA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langgraph>=0.2,<1.0",
    "pydantic>=2.9,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
